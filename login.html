<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow – Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
</head>

<body class="auth-body">

    <!-- ===== LOGIN PAGE ===== -->
    <div class="auth-page">

        <!-- Branding -->
        <div class="auth-brand">
            <div class="logo-icon" style="width:44px;height:44px;font-size:1.4rem;">⚡</div>
            <span class="logo-text" style="font-size:1.5rem;">TaskFlow</span>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">

            <!-- L2: Mode tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-mode="signin">Sign In</button>
                <button class="auth-tab" data-mode="signup">Sign Up</button>
            </div>

            <!-- L3: Role selector -->
            <div class="role-selector">
                <button class="role-btn" data-role="teacher">
                    <span class="role-icon">👨‍🏫</span>
                    <span>Teacher</span>
                </button>
                <button class="role-btn active" data-role="student">
                    <span class="role-icon">🎓</span>
                    <span>Student</span>
                </button>
            </div>

            <!-- Error message -->
            <div id="auth-error" class="auth-error"></div>

            <!-- L1: Sign In form -->
            <div id="signin-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input id="si-email" type="email" class="form-control auth-input" placeholder="you@example.com" />
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input id="si-pass" type="password" class="form-control auth-input" placeholder="••••••••" />
                </div>
            </div>

            <!-- L4: Sign Up form (hidden by default) -->
            <div id="signup-form" style="display:none;">
                <div class="form-group">
                    <label class="form-label">Full Name <span class="req">*</span></label>
                    <input id="su-name" type="text" class="form-control auth-input" placeholder="Jamie Doe" />
                </div>
                <div class="form-group">
                    <label class="form-label">Email <span class="req">*</span></label>
                    <input id="su-email" type="email" class="form-control auth-input" placeholder="you@example.com" />
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="req">*</span> <span
                            style="font-size:0.7rem;font-weight:400;">(min 6 chars)</span></label>
                    <input id="su-pass" type="password" class="form-control auth-input" placeholder="••••••••" />
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password <span class="req">*</span></label>
                    <input id="su-confirm" type="password" class="form-control auth-input" placeholder="••••••••" />
                </div>
            </div>

            <!-- Submit button -->
            <button id="auth-submit" class="btn btn-auth btn-primary">Sign In</button>

        </div><!-- /auth-card -->

    </div><!-- /auth-page -->

    <div class="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
